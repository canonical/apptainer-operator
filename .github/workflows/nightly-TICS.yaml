# Example caller workflow — lives in each consuming repository as
# .github/workflows/tics-scan.yaml. Schedules cannot live in a reusable
# workflow, so each repo keeps its own cron here.

name: Nightly TICS scan

on:
  schedule:
    - cron: '15 17 * * THU' # Every Thursday at 17:15 UTC
  workflow_dispatch:
  push:
    branches:
      - test-tics-workflow

permissions:
  contents: read

jobs:
  TICS:
    uses: canonical/hpc-team/.github/workflows/tics-scan.yaml@test-tics-workflow
    with:
      project: apptainer-operator
    secrets: inherit
